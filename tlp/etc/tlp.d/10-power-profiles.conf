# Keep TLP's balanced and power-saver profiles distinct on this laptop.
# balanced uses the _BAT settings; power-saver uses the _SAV settings.

CPU_SCALING_MIN_FREQ_ON_BAT=0
CPU_SCALING_MAX_FREQ_ON_BAT=1800000
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100
CPU_BOOST_ON_BAT=0
PLATFORM_PROFILE_ON_BAT=balanced

CPU_SCALING_MIN_FREQ_ON_SAV=0
CPU_SCALING_MAX_FREQ_ON_SAV=800000
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=100
CPU_BOOST_ON_SAV=0
PLATFORM_PROFILE_ON_SAV=low-power
