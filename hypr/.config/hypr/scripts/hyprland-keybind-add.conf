# ~/.config/hypr/scripts/hyprland-keybind-add.conf
# Example Hyprland configuration for key hold detection scripts

# Add this to your main.conf or create a new keybind file

# Find your key codes first:
# ~/.config/hypr/scripts/find-keycode.sh

# Audio recording - hold key to record, release to stop
# Using arecord (ALSA)
bind = , KEYCODE, exec, ~/.config/hypr/scripts/audio-hold-record.sh

# Using ffmpeg
# bind = , KEYCODE, exec, ~/.config/hypr/scripts/ffmpeg-audio-record.sh

# Using PipeWire/PulseAudio
# bind = , KEYCODE, exec, ~/.config/hypr/scripts/pipewire-record.sh

# Key hold detection with duration-based actions
bind = , KEYCODE, exec, ~/.config/hypr/scripts/key-hold-detect.sh

# Python-based detection (requires evdev)
# bind = , KEYCODE, exec, ~/.config/hypr/scripts/key-hold-python.py

# Example: Use Space key for recording (code 231)
# bind = , 231, exec, ~/.config/hypr/scripts/audio-hold-record.sh

# Example: Use Enter key for recording (code 28)
# bind = , 28, exec, ~/.config/hypr/scripts/audio-hold-record.sh

# Example: Use a modifier + key combination
# bind = $mainMod, R, exec, ~/.config/hypr/scripts/key-hold-detect.sh
